<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Kaiju type:
       display    Big Shoulders Display  + Cairo (Arabic), Dela Gothic One (Japanese): lock clock, banner names
       saying     Dela Gothic One        lock saying; also the CJK fallback
       interface  Archivo                + IBM Plex Sans Arabic, Dela Gothic One
       data       Red Hat Mono           + IBM Plex Sans Arabic, JetBrains Mono Nerd Font, Dela Gothic One
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. Red Hat Mono has no powerline/Nerd glyphs;
     JetBrains Mono Nerd Font supplies them (tmux slants, the prompt arrow). -->
<fontconfig>
  <alias binding="same">
    <family>Archivo</family>
    <accept><family>IBM Plex Sans Arabic</family><family>Dela Gothic One</family></accept>
  </alias>
  <alias binding="same">
    <family>Big Shoulders Display</family>
    <accept><family>Cairo</family><family>Dela Gothic One</family></accept>
  </alias>
  <alias binding="same">
    <family>Red Hat Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family><family>Dela Gothic One</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Archivo</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Archivo</family>
      <family>Cairo</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Red Hat Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Dela Gothic One</family>
    </prefer>
  </alias>
</fontconfig>
