# Kaiju tmux. Status at the bottom on Slag.
# Every block is a terraced plate like the rest of the theme, not a slant: it
# opens with the two-step cut top-left (▗▟, U+2597 U+259F) and closes with the
# two-step cut bottom-right (▛▘, U+259B U+2598), in the block's colour on Slag.
# Session name on Ember; the clock on Raised Slag with a Magma left rule; the
# current window on Raised Slag.
# The steps are quadrant block elements, which the terminals draw themselves.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#161311,fg=#A89070"

set -g status-left-length 44
set -g status-left "#[bg=#161311,fg=#9E3B14]▗▟#[bg=#9E3B14,fg=#ECE6DA] #{=/24/…:session_name} #[bg=#161311,fg=#9E3B14]▛▘ "

set -g status-right-length 40
set -g status-right "#[bg=#161311,fg=#221C18]▗▟#[bg=#221C18,fg=#FF8A3D]▎#[fg=#ECE6DA]%H:%M #[bg=#161311,fg=#221C18]▛▘"

# Windows are plain index:name. Active on Raised Slag with the Magma left rule,
# others Ochre, activity in Spine.
set -g window-status-separator ""
set -g window-status-format "#[fg=#A89070]  #{?window_activity_flag,#[fg=#5FB8FF],}#I:#W  "
set -g window-status-current-format "#[bg=#161311,fg=#221C18]▗▟#[bg=#221C18,fg=#FF8A3D]▎#[fg=#ECE6DA]#I:#W #[bg=#161311,fg=#221C18]▛▘"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active Ember, inactive Hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#3a2e26"
set -g pane-active-border-style "fg=#9e3b14"
set -g pane-border-indicators off

set -g message-style "bg=#221C18,fg=#ECE6DA"
set -g message-command-style "bg=#221C18,fg=#FF8A3D"
set -g mode-style "bg=#221C18,fg=#ECE6DA"
set -g copy-mode-match-style "bg=#221C18,fg=#5FB8FF,underscore"
set -g copy-mode-current-match-style "bg=#221C18,fg=#FF8A3D,underscore"
set -g menu-style "bg=#0C0B0A,fg=#A89070"
set -g menu-selected-style "bg=#221C18,fg=#ECE6DA"
set -g menu-border-style "fg=#9E3B14"
set -g menu-border-lines single
set -g popup-border-style "fg=#9E3B14"
set -g popup-border-lines single
set -g display-panes-colour "#3A2E26"
set -g display-panes-active-colour "#FF8A3D"
set -g clock-mode-colour "#FF8A3D"
