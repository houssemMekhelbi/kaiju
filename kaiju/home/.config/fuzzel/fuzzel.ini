# Kaiju launcher for fuzzel (unused: SUPER+D runs kaiju-launcher, foot + fzf).

[main]
font=Archivo:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=161311F7
text=A89070FF
message=A89070FF
prompt=FF8A3DFF
placeholder=7A6656FF
input=ECE6DAFF
match=9E3B14FF
selection=221C18FF
selection-text=ECE6DAFF
selection-match=FF8A3DFF
counter=5FB8FFFF
border=9E3B14FF

[border]
width=1
radius=3
