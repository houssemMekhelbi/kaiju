# Kaiju lock screen (three sayings, rotating). Left:
# the clock in Big Shoulders with the Magma glow behind it, the only place the
# glow touches type; the date in letter-spaced mono; the password on a terraced
# plane. Right: the saying in vertical Dela Gothic One columns (tategaki, read
# right to left), its romaji turned 90 degrees beside it, and three lit plates
# under it. No username. Sayings: ~/.config/hypr/kaiju/sayings.txt.
# The plane and the plates are PNGs from ~/.config/hypr/kaiju/build-art.py.
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/kaiju/wallpaper.png
    color = rgb(0C0B0A)
    blur_passes = 3
    blur_size = 4
    brightness = 0.60
    vibrancy = 0
    noise = 0.01
}

# ---- left: clock, date, field ------------------------------------------

label {
    monitor =
    text = <span weight='800'>$TIME</span>
    color = rgba(ECE6DAFF)
    font_size = 210
    font_family = Big Shoulders Display
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(FF8A3DFF)
    shadow_boost = 0.9
    position = 186, 150
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>$(date +'%A · %-d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(A89070FF)
    font_size = 15
    font_family = Red Hat Mono
    position = 198, 10
    halign = left
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/kaiju/lock-field.png
    size = 52
    rounding = 0
    border_size = 0
    position = 196, -96
    halign = left
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 440, 52
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(FF8A3DFF)
    font_family = Red Hat Mono
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##FF8A3D">─</span>   <span foreground="##A89070">password</span>
    fail_text = <span foreground="##FF3B3B">$FAIL</span>
    check_text = <span foreground="##5FB8FF">verifying</span>
    zindex = 1
    position = 196, -96
    halign = left
    valign = center
}

# ---- right: the saying, tategaki -----------------------------------------

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kaiju-lock-saying jp1
    color = rgba(ECE6DAFF)
    font_size = 80
    font_family = Dela Gothic One
    text_align = center
    position = -290, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kaiju-lock-saying jp2
    color = rgba(ECE6DAFF)
    font_size = 80
    font_family = Dela Gothic One
    text_align = center
    position = -405, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kaiju-lock-saying romaji
    color = rgba(A89070FF)
    font_size = 14
    font_family = Red Hat Mono
    rotate = 90
    position = -215, 80
    halign = right
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/kaiju/lock-plates.png
    size = 80
    rounding = 0
    border_size = 0
    position = -290, 130
    halign = right
    valign = bottom
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>KAIJU</span>
    color = rgba(7A6656FF)
    font_size = 9
    font_family = Red Hat Mono
    position = 198, 40
    halign = left
    valign = bottom
}
