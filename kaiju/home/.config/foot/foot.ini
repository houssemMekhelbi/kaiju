# Kaiju terminal. Night at 86% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Red Hat Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.86
blur=yes
background=0C0B0A
foreground=A89070
cursor=0C0B0A FF8A3D
regular0=0C0B0A
regular1=FF3B3B
regular2=5DA88A
regular3=C98A2E
regular4=4F8FD6
regular5=B85C8A
regular6=5FB8FF
regular7=A89070
bright0=7A6656
bright1=FF6B5E
bright2=7FCBA8
bright3=E8B45A
bright4=7FB4FF
bright5=D98AB0
bright6=9AD3FF
bright7=ECE6DA
selection-foreground=ECE6DA
selection-background=221C18
jump-labels=0C0B0A FF8A3D
scrollback-indicator=0C0B0A 9E3B14
search-box-no-match=0C0B0A FF3B3B
search-box-match=0C0B0A FF8A3D
urls=5FB8FF

